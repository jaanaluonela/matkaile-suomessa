<link rel="stylesheet" href="yhteinen-alavalikko-v1.css?v=1"><script defer src="yhteinen-alavalikko-v1.js?v=1"></script><style>
.route-page-v90 .bottomnav.simple-bottom { display: none !important; }
.route-card-v90 [hidden] { display: none !important; }
.route-card-v90 .route-add-stop { min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid #9db8ab; background: #edf5ef; color: #155343; font: inherit; font-weight: 700; cursor: pointer; }
.route-card-v90 .msroute-real-controls { display: grid; gap: 12px; margin-top: 16px; }
.route-card-v90 .msroute-distance { border: 1px solid #9db8ab; border-radius: 12px; padding: 8px 12px; }
.route-card-v90 .msroute-distance-options { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.route-card-v90 .msroute-distance-options label { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: 0; }
.route-card-v90 .msroute-distance-options input { width: auto; min-height: 0; margin: 0; }
.route-card-v90 select, .route-card-v90 .msroute-primary { width: 100%; min-height: 44px; font: inherit; border-radius: 12px; }
.route-card-v90 select { border: 1px solid #9db8ab; padding: 8px; }
.route-card-v90 .msroute-primary { border: 0; background: #146d4b; color: white; font-weight: 750; padding: 12px; cursor: pointer; }
.route-card-v90 .msroute-primary:disabled { opacity: .7; }
.route-page-v90 #ms302-results { display: grid; gap: 12px; }
.route-page-v90 .msroute-result { display: flex; gap: 12px; align-items: center; padding: 14px; border: 1px solid #d9e5d9; border-radius: 16px; background: white; }
.route-page-v90 .msroute-photo { width: 72px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; }
.route-page-v90 .msroute-card-body { min-width: 0; overflow-wrap: anywhere; }
.route-page-v90 .msroute-card-body p { margin: 4px 0; }
</style></head>
<body><div class="app route-page-v90">
<header class="route-hero-v90"><div class="toprow"><button class="icon-btn" onclick="history.back()">‹</button><button class="icon-btn" onclick="location.href='index.html'">🏠</button></div><div><h1>Suunnittele matka</h1><p>Löydä pysähdyspaikat ajoreittisi läheltä.</p></div></header>
<main class="content route-content-v90">
<section class="section card route-card-v90 msroute-panel" data-route-planner aria-label="Reittisuunnittelu">
<form id="routeForm" class="msroute-route">
  <label>Lähtöpaikka<input id="msroute-from" name="origin" placeholder="Esim. Vääksy" required></label>
  <label>Määränpää<input id="msroute-to" name="destination" placeholder="Esim. Kokkola" required></label>
  <label>Välietappi 1 <small>(valinnainen)</small><input name="waypoint" placeholder="Esim. Jyväskylä"></label>
  <label data-extra-stop hidden>Välietappi 2<input name="waypoint"></label>
  <label data-extra-stop hidden>Välietappi 3<input name="waypoint"></label>
  <button id="addRouteVia" class="route-add-stop" type="button">+ Lisää välietappi</button>
</form>
<div class="msroute-view" hidden></div>
<noscript>Reittihaku tarvitsee JavaScriptin.</noscript>
</section>
<section class="section" aria-label="Pysähdysehdotukset">
  <p id="ms302-count" aria-live="polite"></p>
  <div id="ms302-results"></div>
  <div id="ms302-more" hidden></div>
</section>
</main><nav class="bottomnav simple-bottom"><a href="index.html"><span>🏠</span>Koti</a><a href="kartta.html"><span>🗺️</span>Kartta</a><a href="profiili.html"><span>👤</span>Minä</a></nav></div>
<script>
(() => {
  const add = document.getElementById('addRouteVia');
  const stops = [...document.querySelectorAll('#routeForm [data-extra-stop]')];
  add.addEventListener('click', () => {
    const next = stops.find(label => label.hidden);
    if (!next) return;
    next.hidden = false;
    next.querySelector('input').focus();
    add.hidden = stops.every(label => !label.hidden);
  });
})();
</script>
