<!-- MatkaileSuomessa version: v184 -->
<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123e35">
  <meta name="description" content="Karavaanarin opas Suomen leirintäalueisiin, matkaparkkeihin ja paikkakuntien palveluihin.">
  <title>Matkaile Suomessa</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{
      --home-ink:#173c34;
      --home-muted:#5d6e68;
      --home-green:#17634f;
      --home-sand:#f3ead9;
      --home-gold:#d5a64b;
      --home-card:#fff;
      --home-line:#dfe8e3;
      --home-shadow:0 12px 30px rgba(20,62,52,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#e8efe9;
      color:var(--home-ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    a{color:inherit}
    .home-shell{
      width:min(100%,520px);
      min-height:100vh;
      margin:0 auto;
      padding:12px 12px calc(92px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 100% 0,rgba(213,166,75,.10),transparent 28%),
        #fafbf8;
      box-shadow:0 0 42px rgba(17,57,47,.11);
    }
    .hero{
      position:relative;
      min-height:500px;
      overflow:hidden;
      display:flex;
      align-items:flex-end;
      padding:26px 22px;
      border-radius:28px;
      color:#fff;
      background:
        linear-gradient(180deg,rgba(8,34,29,.03) 20%,rgba(8,34,29,.30) 55%,rgba(8,34,29,.92) 100%),
        url("assets/hero/hero-karavaanari-v184.jpg") 64% center/cover no-repeat;
      box-shadow:0 18px 42px rgba(18,62,53,.20);
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg,rgba(8,38,31,.18),transparent 58%);
      pointer-events:none;
    }
    .hero-content{position:relative;z-index:1;width:100%}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin:0 0 10px;
      padding:8px 12px;
      border:1px solid rgba(255,255,255,.48);
      border-radius:999px;
      background:rgba(13,51,42,.52);
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.05em;
      text-transform:uppercase;
      backdrop-filter:blur(8px);
    }
    .hero h1{
      max-width:390px;
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(2.45rem,10vw,3.55rem);
      line-height:.97;
      letter-spacing:-.045em;
      text-wrap:balance;
    }
    .hero p{
      max-width:400px;
      margin:14px 0 19px;
      color:rgba(255,255,255,.92);
      font-size:1rem;
      line-height:1.48;
    }
    .hero-button{
      min-height:54px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:12px 17px;
      border:1px solid rgba(255,255,255,.45);
      border-radius:16px;
      background:#f7f0e1;
      color:#153f35;
      font-weight:850;
      text-decoration:none;
      box-shadow:0 9px 22px rgba(0,0,0,.20);
    }
    .hero-stats{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin:0 0 16px;
    }
    .hero-stats span{
      padding:7px 10px;
      border:1px solid rgba(255,255,255,.32);
      border-radius:999px;
      background:rgba(12,48,40,.52);
      color:#fff;
      font-size:.78rem;
      font-weight:800;
      backdrop-filter:blur(7px);
    }
    .section{margin-top:32px}
    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:14px;
      margin:0 4px 13px;
    }
    .section-kicker{
      margin:0 0 3px;
      color:var(--home-green);
      font-size:.75rem;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .section h2{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:1.58rem;
      line-height:1.15;
      letter-spacing:-.025em;
    }
    .text-link{
      flex:none;
      padding-bottom:2px;
      color:var(--home-green);
      font-size:.87rem;
      font-weight:800;
      text-decoration:none;
    }
    .path-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .path-card{
      min-height:184px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:17px;
      border:1px solid var(--home-line);
      border-radius:22px;
      background:var(--home-card);
      text-decoration:none;
      box-shadow:0 10px 26px rgba(20,62,52,.08);
    }
    .path-card:first-child{background:linear-gradient(145deg,#dcece3,#fff 72%)}
    .path-card:last-child{background:linear-gradient(145deg,#f7ead4,#fff 72%)}
    .path-icon{
      width:48px;height:48px;
      display:grid;place-items:center;
      border-radius:16px;
      background:rgba(255,255,255,.88);
      font-size:1.55rem;
      box-shadow:0 5px 14px rgba(20,62,52,.08);
    }
    .path-card h3{margin:16px 0 5px;font-size:1.08rem}
    .path-card p{margin:0;color:var(--home-muted);font-size:.84rem;line-height:1.38}
    .path-arrow{align-self:flex-end;margin-top:12px;color:var(--home-green);font-size:1.2rem;font-weight:900}
    .search-box{
      position:relative;
      margin:0 2px;
    }
    .search-box input{
      width:100%;
      min-height:54px;
      padding:0 46px 0 17px;
      border:1px solid #cedbd4;
      border-radius:18px;
      background:#fff;
      color:var(--home-ink);
      font:inherit;
      box-shadow:0 8px 22px rgba(20,62,52,.07);
    }
    .search-box input:focus{outline:3px solid rgba(39,123,96,.18);border-color:#438a74}
    .search-symbol{
      position:absolute;right:16px;top:50%;
      transform:translateY(-50%);
      font-size:1.2rem;
      pointer-events:none;
    }
    .search-results{
      display:none;
      margin:8px 2px 0;
      overflow:hidden;
      border:1px solid var(--home-line);
      border-radius:15px;
      background:#fff;
      box-shadow:var(--home-shadow);
    }
    .search-results.is-open{display:block}
    .search-results a{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:13px 15px;
      border-bottom:1px solid #edf1ee;
      text-decoration:none;
      font-weight:750;
    }
    .search-results a:last-child{border-bottom:0}
    .search-results small{color:var(--home-muted);font-weight:600}
    .destination-row{
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:minmax(176px,72%);
      gap:11px;
      overflow-x:auto;
      padding:1px 3px 11px;
      scroll-snap-type:x mandatory;
      scrollbar-width:none;
    }
    .destination-row::-webkit-scrollbar{display:none}
    .destination{
      scroll-snap-align:start;
      min-height:142px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding:16px;
      overflow:hidden;
      position:relative;
      border-radius:19px;
      color:#fff;
      text-decoration:none;
      box-shadow:0 8px 20px rgba(20,62,52,.12);
    }
    .destination::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(9,39,32,.02),rgba(9,39,32,.82));
    }
    .destination:nth-child(1){background:url("assets/hero/hero-karavaanari-v184.jpg") 68% center/cover}
    .destination:nth-child(2){background:url("assets/hero/hero-asikkala.jpg") center/cover}
    .destination:nth-child(3){background:url("assets/hero/hero-paijat-hame.jpg") center/cover}
    .destination > *{position:relative}
    .destination small{margin-bottom:3px;color:rgba(255,255,255,.78);font-weight:750}
    .destination strong{font-size:1.22rem}
    .feature-card{
      display:grid;
      grid-template-columns:1fr auto;
      gap:16px;
      align-items:center;
      padding:20px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:23px;
      background:
        radial-gradient(circle at 100% 0,rgba(213,166,75,.18),transparent 38%),
        linear-gradient(145deg,#164d40,#0f352d);
      color:#fff;
      text-decoration:none;
      box-shadow:0 14px 32px rgba(15,53,45,.18);
    }
    .feature-card .tag{
      display:inline-block;
      margin-bottom:8px;
      color:#aed6c7;
      font-size:.75rem;
      font-weight:900;
      letter-spacing:.07em;
      text-transform:uppercase;
    }
    .feature-card h2{margin:0 0 7px;color:#fff}
    .feature-card p{margin:0;color:rgba(255,255,255,.76);font-size:.9rem;line-height:1.45}
    .feature-icon{
      width:60px;height:60px;
      display:grid;place-items:center;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.10);
      font-size:1.8rem;
    }
    .later-note{
      margin:22px 4px 0;
      padding:13px 15px;
      border:1px solid #dce5df;
      border-radius:15px;
      color:var(--home-muted);
      background:linear-gradient(135deg,#f3f7f3,#fff);
      font-size:.82rem;
      line-height:1.4;
    }
    .tip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .tip-card{
      min-height:112px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:15px;
      border:1px solid rgba(23,99,79,.08);
      border-radius:18px;
      color:var(--home-ink);
      text-decoration:none;
      box-shadow:0 8px 20px rgba(20,62,52,.06);
    }
    .tip-card:nth-child(1){background:#e8f2ed}
    .tip-card:nth-child(2){background:#eaf1f7}
    .tip-card:nth-child(3){background:#f0edf7}
    .tip-card:nth-child(4){background:#f7efe3}
    .tip-card span{font-size:1.45rem}
    .tip-card strong{font-size:.92rem;line-height:1.2}
    .tip-card small{color:var(--home-muted);font-size:.72rem}
    .bottom-nav{
      position:fixed;
      z-index:20;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:min(100%,520px);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      border-top:1px solid #dfe7e2;
      background:rgba(255,255,255,.96);
      box-shadow:0 -8px 24px rgba(20,62,52,.08);
      backdrop-filter:blur(12px);
    }
    .bottom-nav a{
      min-height:54px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      border-radius:13px;
      color:#53675f;
      font-size:.71rem;
      font-weight:750;
      text-decoration:none;
    }
    .bottom-nav a span{font-size:1.2rem}
    .bottom-nav a[aria-current="page"]{background:#e8f2ed;color:#155342}
    @media (min-width:521px){
      .home-shell{padding-top:20px}
      .hero{min-height:450px}
    }
    @media (prefers-reduced-motion:no-preference){
      .hero-button,.path-card,.destination,.feature-card{transition:transform .18s ease,box-shadow .18s ease}
      .hero-button:active,.path-card:active,.destination:active,.feature-card:active{transform:scale(.985)}
    }
  
/* Etusivun logo ja mobiiliasettelu v190 */

.home-shell > .hero > .hero-content {position:relative;left:auto;right:auto;bottom:auto;display:block;width:100%;min-width:0;}
.home-shell .home-logo {display:block !important;width:100% !important;max-width:600px !important;height:auto !important;min-height:0 !important;max-height:143px !important;aspect-ratio:1179 / 280 !important;object-fit:contain !important;margin:0 auto 20px !important;border-radius:12px;}
.home-shell .hero h1 {font-size:clamp(1.65rem,7vw,2.6rem);line-height:1.12;max-width:100%;overflow-wrap:anywhere;}
.home-shell .hero p {font-size:1rem;line-height:1.5;margin:14px 0 19px;}


.home-shell{padding:16px 16px 20px!important}
.home-shell>.hero{padding:16px!important;border-radius:20px;box-shadow:none}
.home-shell .home-logo{margin-bottom:14px!important;max-height:100px!important}
.home-shell .hero h1{font-size:28px!important;line-height:1.15!important;letter-spacing:-.02em}
.home-shell .hero p{font-size:16px!important;font-weight:400!important;line-height:1.45!important;margin:10px 0 12px!important}
.hero-stats{gap:8px;margin:0!important}.hero-stats span{padding:0;border:0;background:none;font-size:12px}
.section{margin-top:24px}.section-head{margin:0 0 12px;align-items:center;gap:8px}
.section h2{font-family:system-ui;font-size:22px;line-height:1.2;letter-spacing:-.02em}
#hakuotsikko{font-size:20px}.search-box{margin:0}.search-box input{min-height:50px;border-radius:14px;padding-left:12px;font-size:16px;box-shadow:none}
.tip-grid{gap:10px}.tip-card{min-height:108px;padding:12px;border-radius:16px;box-shadow:none;gap:7px}.tip-card strong{font-size:15px}.tip-card small{font-size:12px}.tip-card span{font-size:23px}
.destination-row{grid-auto-flow:unset;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:visible;padding:0}
.destination{min-height:108px;padding:13px;border-radius:16px;box-shadow:none;background:#e8f2ed!important;color:#173c34}
.destination::before{display:none}.destination small{color:#5d6e68;font-size:12px}.destination strong{font-size:17px;line-height:1.2}
.text-link{font-size:13px}.later-note{margin:20px 0 0;padding:0;border:0;border-radius:0;background:none;font-size:12px}

</style>

    const input = document.querySelector("#place-search");
    const results = document.querySelector("#search-results");

    function showResults() {
      const query = input.value.trim().toLocaleLowerCase("fi");
      if (!query) {
        results.classList.remove("is-open");
        results.innerHTML = "";
        return;
      }
      const matches = places.filter(place =>
        (place.name + " " + place.meta).toLocaleLowerCase("fi").includes(query)
      ).slice(0, 5);
      results.innerHTML = matches.length
        ? matches.map(place => `<a href="${place.url}"><span>${place.name}</span><small>${place.meta}</small></a>`).join("")
        : '<a href="maakunnat.html"><span>Selaa kaikkia maakuntia</span><small>Ei suoraa osumaa</small></a>';
      results.classList.add("is-open");
    }
    input.addEventListener("input", showResults);
    input.addEventListener("focus", showResults);
    document.addEventListener("click", event => {
      if (!event.target.closest(".search-box") && !event.target.closest(".search-results")) {
        results.classList.remove("is-open");
      }
    });
