<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omat matkat – Matkaile Suomessa</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f7f7f2;color:#294436;margin:0}main{max-width:780px;margin:auto;padding:18px 18px 85px}h1{font-size:1.8rem}.card{background:#fff;border:1px solid #e2e8dc;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #243a2110}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea{width:100%;font:inherit;border:1px solid #afbeaf;border-radius:10px;padding:11px}textarea{min-height:110px}button,.map{font:inherit;border:0;border-radius:10px;background:#28775a;color:white;padding:11px 15px;cursor:pointer;text-decoration:none;display:inline-block}.quiet{background:#eaf2ea;color:#285b42}.danger{background:#fae8e4;color:#893e30}.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}.hidden{display:none}.muted{color:#667769}.trip{display:block;width:100%;text-align:left;margin:8px 0;background:white;color:#294436;border:1px solid #dce5da}.stop{border-left:3px solid #91c4a4;margin-left:8px;padding:9px 16px}.stop button{margin:5px 5px 0 0}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}.photo{position:relative}.photo img{width:100%;height:105px;object-fit:cover;border-radius:10px}.photo button{position:absolute;right:3px;top:3px;padding:3px 7px;background:white;color:#853c33}nav{position:fixed;bottom:0;background:white;border-top:1px solid #ddd;width:100%;display:flex;justify-content:center;gap:24px;padding:12px}nav a,a{color:#28664e}
</style></head><body><main><a href="index.html">← Etusivu</a><h1>❤️ Omat matkat</h1>
<section id="list"><p class="muted">Matkapäiväkirja, kuvat ja kuljettu reitti.</p><button id="new">+ Lisää matka</button><div id="trips"></div></section>
<section id="editor" class="hidden"><button id="back" class="quiet">← Omat matkat</button><div class="card"><h2>Matkan tiedot</h2><label for="name">Matkan nimi</label><input id="name" placeholder="Esim. Kesäreissu"><div class="row"><div><label for="begin">Alkaa</label><input id="begin" type="date"></div><div><label for="end">Päättyy</label><input id="end" type="date"></div></div><label for="diary">Päiväkirja</label><textarea id="diary" placeholder="Mitä näit ja koit?"></textarea></div>
<div class="card"><h2>📍 Reitti</h2><p class="muted">Lisää pysähdyspaikat matkustusjärjestyksessä.</p><div id="stops"></div><label for="place">Pysähdyspaikka</label><div class="row"><div><input id="place" placeholder="Paikkakunta tai osoite"></div><button id="add">Lisää</button></div><p><a id="map" class="map hidden" target="_blank" rel="noopener">Avaa reitti kartassa ↗</a></p></div>
<div class="card"><h2>📷 Kuvat</h2><label for="files">Lisää kuvia</label><input id="files" type="file" accept="image/*" multiple><div id="photos" class="photos"></div><p class="muted">Matkat ja kuvat säilyvät tässä selaimessa. Selaimen tietojen poistaminen poistaa ne.</p></div>
<button id="save">Tallenna matka</button> <button id="remove" class="danger">Poista matka</button></section></main><nav><a href="index.html">🏠 Koti</a><a href="maakunnat.html">🇫🇮 Tutustu</a><a href="paivakirja.html">❤️ Omat matkat</a></nav>
<script>
const $=s=>document.getElementById(s),key='ms_trips_v2';let trips=[],active=null,db;
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function persist(){localStorage.setItem(key,JSON.stringify(trips))}
function load(){try{trips=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(trips))trips=[];if(!trips.length){let old=JSON.parse(localStorage.getItem('ms_trips')||'[]');if(Array.isArray(old)&&old.length){trips=old.map(x=>({id:id(),name:String(x.name||'Matka'),begin:x.date||'',end:'',diary:'',stops:[]}));persist()}}}catch{trips=[]}list()}
function list(){$('trips').replaceChildren();if(!trips.length)$('trips').textContent='Ei vielä tallennettuja matkoja.';trips.forEach(t=>{let b=document.createElement('button');b.className='trip';b.textContent=(t.name||'Nimetön matka')+' · '+(t.begin||'Avaa päiväkirja');b.onclick=()=>open(t.id);$('trips').append(b)})}
function back(){active=null;$('editor').classList.add('hidden');$('list').classList.remove('hidden');list()}
function open(k){active=k||id();let t=trips.find(x=>x.id===active)||{};for(let f of ['name','begin','end','diary'])$(f).value=t[f]||'';$('list').classList.add('hidden');$('editor').classList.remove('hidden');stops();photos();window.scrollTo(0,0)}
function capture(){let t=trips.find(x=>x.id===active);if(!t){t={id:active,stops:[]};trips.unshift(t)}for(let f of ['name','begin','end','diary'])t[f]=$(f).value;t.name=t.name.trim()||'Nimetön matka';persist();return t}
function stops(){let a=trips.find(x=>x.id===active)?.stops||[],box=$('stops');box.replaceChildren();a.forEach((name,i)=>{let d=document.createElement('div');d.className='stop';let label=document.createElement('strong');label.textContent=(i+1)+'. '+name;d.append(label);for(let [txt,fn] of [['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['Poista',()=>{capture().stops.splice(i,1);persist();stops()}]]){let b=document.createElement('button');b.className='quiet';b.textContent=txt;b.onclick=fn;d.append(b)}box.append(d)});$('map').classList.toggle('hidden',a.length<2);if(a.length>1)$('map').href='https://www.google.com/maps/dir/'+a.map(encodeURIComponent).join('/')+'/'}
function move(i,n){let a=capture().stops,j=i+n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist();stops()}
function photoStore(mode,value){return new Promise(resolve=>{if(!db)return resolve(mode==='get'?[]:null);let s=db.transaction('photos',mode==='get'?'readonly':'readwrite').objectStore('photos'),q=mode==='get'?s.getAll():mode==='put'?s.put(value):s.delete(value);q.onsuccess=()=>resolve(mode==='get'?q.result.filter(p=>p.trip===active):null);q.onerror=()=>resolve(mode==='get'?[]:null)})}
async function photos(){let current=active,box=$('photos');box.replaceChildren();for(let p of await photoStore('get')){if(current!==active)return;let d=document.createElement('div'),img=document.createElement('img'),b=document.createElement('button');d.className='photo';img.src=URL.createObjectURL(p.blob);img.alt=p.name;img.onload=()=>URL.revokeObjectURL(img.src);b.textContent='×';b.setAttribute('aria-label','Poista kuva');b.onclick=async()=>{await photoStore('delete',p.id);photos()};d.append(img,b);box.append(d)}}
$('new').onclick=()=>open();$('back').onclick=back;$('save').onclick=()=>{capture();back()};$('add').onclick=()=>{let name=$('place').value.trim();if(!name)return;capture().stops.push(name);persist();$('place').value='';stops()};$('place').onkeydown=e=>{if(e.key==='Enter')$('add').click()};
$('files').onchange=async e=>{let files=[...e.target.files];capture();for(let f of files)if(f.type.startsWith('image/'))await photoStore('put',{id:id(),trip:active,name:f.name,blob:f});e.target.value='';photos()};
$('remove').onclick=async()=>{if(!confirm('Poistetaanko matka ja sen kuvat?'))return;for(let p of await photoStore('get'))await photoStore('delete',p.id);trips=trips.filter(t=>t.id!==active);persist();back()};
if(window.indexedDB){let q=indexedDB.open('ms_trip_photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('photos',{keyPath:'id'});q.onsuccess=()=>{db=q.result;load()};q.onerror=load}else load();
</script></body></html>
