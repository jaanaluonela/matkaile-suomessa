function renderDetail(){const d=(window.msKohteetV296||[]).find(x=>x.id===new URLSearchParams(location.search).get('id'));const host=document.getElementById('detail');const back=document.getElementById('back');if(!d){host.textContent='Kohdetta ei löytynyt. Siirry yöpymishakuun.';return}back.href=d.type==='park'?'matkaparkit.html':'leirintaalueet.html';const el=(tag,text,cl)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cl)e.className=cl;return e};host.replaceChildren();host.append(el('p',d.type==='park'?'🅿️ Matkaparkki':'🏕️ Leirintäalue','tag'),el('h1',d.name),el('p',d.city+' · '+d.region),el('p',d.description),el('p',d.address));const dl=el('dl');for(const [label,val] of [['Aukiolo',d.season||'Tarkista alueelta'],['Palvelut',d.verifiedServices?.length?d.verifiedServices.map(x=>({electric:'Sähkö',shower:'Suihku',sauna:'Sauna',wc:'WC',water:'Vesi',greywater:'Harmaavesi',chemical:'Kemiallisen WC:n tyhjennys',kitchen:'Keittiö',laundry:'Pyykinpesu',cottages:'Mökit',beach:'Uimaranta'}[x]||x)).join(', '):'Ei palvelutietoa vahvistettu']]){dl.append(el('dt',label),el('dd',val))}host.append(dl);const act=el('div',undefined,'actions');const map=el('a','Ajo-ohjeet ↗');map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.address+', '+d.city);map.target='_blank';map.rel='noopener noreferrer';act.append(map);if(d.website){const www=el('a','Kohteen sivut ↗');www.href=d.website;www.target='_blank';www.rel='noopener noreferrer';act.append(www)}host.append(act);const note=el('p','Tarkista aina kohteen ajantasainen aukiolo, hinnat, varauskäytäntö ja sopivuus matkailuajoneuvolle. Vuoden 2026 luettelotiedot eivät yksin takaa tämänhetkistä käytettävyyttä.','caution');host.append(note);if(d.source){const src=el('a','Tietojen lähde ↗');src.href=d.source;src.rel='noopener noreferrer';src.target='_blank';host.append(src)}document.title=d.name+' – Matkaile Suomessa'}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',renderDetail);else renderDetail();</script></body></html>
